<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ЗВУК — Караоке-баттл</title>
  <meta name="description" content="Браузерная караоке-игра: спой фрагмент и получи оценку за мелодию и ритм. Дуэли и таблица лидеров.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231ec468'/%3E%3Cpath d='M12 22V10l10-2v11' stroke='%23000' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9.5' cy='22' r='2.6'/%3E%3Ccircle cx='19.5' cy='19' r='2.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="#/"><span class="logo-mark"><i data-i="logo"></i></span>ЗВУК</a>
      <nav class="nav">
        <p class="nav-label">Меню</p>
        <a class="nav-item" href="#/" data-route="home" data-short="Главная"><i data-i="home"></i><span>Главная</span></a>
        <a class="nav-item" href="#/tracks" data-route="tracks" data-short="Треки"><i data-i="music"></i><span>Подборки</span></a>
        <a class="nav-item nav-sing" href="#/sing" data-route="sing" data-short="Пой!"><i data-i="mic"></i><span>Пой!</span></a>
        <p class="nav-label">Библиотека</p>
        <a class="nav-item" href="#/top" data-route="top" data-short="Топ"><i data-i="chart"></i><span>Таблица лидеров</span></a>
        <a class="nav-item" href="#/duel" data-route="duel" data-short="Дуэль"><i data-i="swords"></i><span>Дуэль</span></a>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <label class="search">
          <i data-i="search"></i>
          <input id="search" type="search" placeholder="Треки, исполнители" autocomplete="off" aria-label="Поиск по трекам">
        </label>
        <button class="user" id="user" type="button">
          <span class="avatar" id="avatar">Г</span>
          <span id="userName">Гость</span>
          <i data-i="chevron"></i>
        </button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <dialog id="nameDlg" class="dialog">
    <form method="dialog">
      <h3>Как тебя зовут?</h3>
      <p>Под этим именем результаты попадут в таблицу лидеров.</p>
      <input id="nameInput" maxlength="18" placeholder="Например, Саша" autocomplete="nickname">
      <div class="dialog-actions">
        <button class="btn btn-sing" value="ok">Сохранить</button>
        <button class="btn btn-ghost" value="cancel" formnovalidate>Отмена</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/tracks.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/score.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
